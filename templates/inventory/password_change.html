{% extends "inventory/base.html" %}
{% block page_title %}Change password{% endblock %}
{% block content %}
<form method="post" class="card p-4" style="max-width:520px">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label small fw-semibold">{{ field.label }}</label>
      <input type="password" name="{{ field.name }}" class="form-control" required>
      {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary">Update password</button>
</form>
{% endblock %}
