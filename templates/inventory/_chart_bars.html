{% comment %}grouped bars: chart{% endcomment %}
{% if chart %}
{% if chart.legend %}
<div class="d-flex gap-3 flex-wrap mb-2" style="font-size:12px">
  {% for item in chart.legend %}
    <span class="d-flex align-items-center gap-1">
      <span style="width:9px;height:9px;border-radius:2px;background:{{ item.tone }}"></span>
      <span class="text-muted">{{ item.name }}</span>
    </span>
  {% endfor %}
</div>
{% endif %}
<svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img"
     aria-label="{{ chart_label|default:'Monthly comparison' }}">
  <line x1="0" y1="{{ chart.baseline }}" x2="{{ chart.width }}" y2="{{ chart.baseline }}"
        stroke="var(--border)" stroke-width="1"/>
  {% for bar in chart.bars %}
    <rect x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.w }}" height="{{ bar.h }}" rx="2.5"
          fill="{{ bar.tone }}"{% if bar.faint %} opacity=".18"{% endif %}>
      <title>{{ bar.title }}</title></rect>
  {% endfor %}
</svg>
<div class="chart-labels">{% for p in chart.labels %}<span>{{ p.text }}</span>{% endfor %}</div>
{% endif %}
