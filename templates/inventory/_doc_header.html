<div class="card p-3 mb-3"><div class="row small">
  <div class="col-md-4"><div class="text-muted">Customer</div><div class="fw-semibold">{{ doc.customer.name }}</div>
    <div class="text-muted">{{ doc.customer.phone }}</div></div>
  <div class="col-md-3"><div class="text-muted">Date</div><div>{{ doc.document_date|date:"d M Y" }}</div></div>
  <div class="col-md-3"><div class="text-muted">Status</div><div>{{ doc.get_status_display }}</div></div>
  <div class="col-md-2 text-end"><div class="text-muted">Total (TZS)</div>
    <div class="h5 mb-0">{{ doc.grand_total|floatformat:2 }}</div></div>
</div>{% if doc.notes %}<hr class="my-2"><div class="small text-muted">{{ doc.notes }}</div>{% endif %}</div>
